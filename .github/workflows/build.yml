name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - es-major: "8"
            elasticsearch: "8.7.0"
            lucene: "9.5.0"
            java: "17"
          - es-major: "9"
            elasticsearch: "9.4.0"
            lucene: "10.4.0"
            java: "24"
    name: Elasticsearch ${{ matrix.elasticsearch }} (Java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: |
          set -euo pipefail
          # The committed wrapper is Gradle 7.6.1, which cannot run on Java 21 or
          # later — it fails with "Unsupported class file major version". The
          # Elasticsearch 9 build needs a newer JDK, so that leg fetches a Gradle
          # that supports it instead of using the wrapper.
          if [ "${{ matrix.es-major }}" = "9" ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.14-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            GRADLE=/tmp/gradle-8.14/bin/gradle
          else
            GRADLE=./gradlew
          fi

          "$GRADLE" clean check assemble \
            -PesMajor=${{ matrix.es-major }} \
            -PelasticsearchVersion=${{ matrix.elasticsearch }} \
            -PluceneVersion=${{ matrix.lucene }}

      # Storage is a shared account quota, and running out of it says nothing
      # about the code. Keep the artifact when there is room, but never let its
      # absence turn a passing build red.
      - name: Upload plugin
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: uzbek-analyzer-plugin-es${{ matrix.es-major }}
          path: build/distributions/*.zip
          retention-days: 7

      - name: Upload test report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-report-es${{ matrix.es-major }}
          path: build/reports/tests/test
          retention-days: 3
