# Throwaway local demo stack. Ten documents, so it is sized accordingly.
# Security is off because this is a single node bound to localhost.
# Do not copy these settings anywhere that leaves your machine.

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    container_name: uz-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ingest.geoip.downloader.enabled=false
      - bootstrap.memory_lock=false
    # 512m heap, but Elasticsearch also needs off-heap for Lucene; 1g leaves it
    # sitting at 98% of the limit.
    mem_limit: 1280m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.15
    container_name: uz-kibana
    depends_on:
      es: { condition: service_healthy }
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      - NODE_OPTIONS=--max-old-space-size=512
      - TELEMETRY_ENABLED=false
    mem_limit: 1g
    ports:
      - "5601:5601"
